<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScentMatrix | Olfactory Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .val-display {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: bold;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .results {
            margin-top: 24px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .results h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .bar-container {
            margin-bottom: 10px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ScentMatrix Volatility Engine</h1>
        <p class="subtitle">Simulate fragrance note decay rates using molecular weights and vapor pressure.</p>
    </header>

    <div class="grid">
        <div class="input-group">
            <label for="topNote">Top Note Ratio (Limonene): <span id="topVal" class="val-display">50%</span></label>
            <input type="range" id="topNote" min="0" max="100" value="50" oninput="updateSliders('top')">
        </div>

        <div class="input-group">
            <label for="heartNote">Heart Note Ratio (Linalool): <span id="heartVal" class="val-display">30%</span></label>
            <input type="range" id="heartNote" min="0" max="100" value="30" oninput="updateSliders('heart')">
        </div>

        <div class="input-group">
            <label for="baseNote">Base Note Ratio (Ambroxan): <span id="baseVal" class="val-display">20%</span></label>
            <input type="range" id="baseNote" min="0" max="100" value="20" oninput="updateSliders('base')">
        </div>

        <div class="input-group">
            <label for="temp">Skin Temperature (°C): <span id="tempVal" class="val-display">32°C</span></label>
            <input type="range" id="temp" min="20" max="40" value="32" oninput="document.getElementById('tempVal').innerText = this.value + '°C'">
        </div>
    </div>

    <button onclick="calculateLongevity()">Run Evaporation Model</button>

    <div class="results" id="resultsBlock" style="display:none;">
        <h2>Estimated Presence After 4 Hours</h2>
        
        <div class="bar-container">
            <div class="bar-label"><span>Top Notes Remaining</span><span id="topRemain">0%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="topBar"></div></div>
        </div>

        <div class="bar-container">
            <div class="bar-label"><span>Heart Notes Remaining</span><span id="heartRemain">0%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="heartBar"></div></div>
        </div>

        <div class="bar-container">
            <div class="bar-label"><span>Base Notes Remaining</span><span id="baseRemain">0%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="baseBar"></div></div>
        </div>
    </div>
</div>

<script>
    function updateSliders(changed) {
        let top = parseInt(document.getElementById('topNote').value);
        let heart = parseInt(document.getElementById('heartNote').value);
        let base = parseInt(document.getElementById('baseNote').value);

        // Simple normalization display
        document.getElementById('topVal').innerText = top + '%';
        document.getElementById('heartVal').innerText = heart + '%';
        document.getElementById('baseVal').innerText = base + '%';
    }

    function calculateLongevity() {
        const topRatio = parseInt(document.getElementById('topNote').value) / 100;
        const heartRatio = parseInt(document.getElementById('heartNote').value) / 100;
        const baseRatio = parseInt(document.getElementById('baseNote').value) / 100;
        const temp = parseInt(document.getElementById('temp').value);

        // Exponential decay model mockup based on vapor pressures
        const tempFactor = 1 + ((temp - 32) * 0.03);
        
        const topRemaining = Math.max(0, Math.round((topRatio * 15) / tempFactor));
        const heartRemaining = Math.max(0, Math.round((heartRatio * 65) / tempFactor));
        const baseRemaining = Math.max(0, Math.round((baseRatio * 95) / tempFactor));

        document.getElementById('resultsBlock').style.display = 'block';

        document.getElementById('topBar').style.width = topRemaining + '%';
        document.getElementById('topRemain').innerText = topRemaining + '%';

        document.getElementById('heartBar').style.width = heartRemaining + '%';
        document.getElementById('heartRemain').innerText = heartRemaining + '%';

        document.getElementById('baseBar').style.width = baseRemaining + '%';
        document.getElementById('baseRemain').innerText = baseRemaining + '%';
    }
</script>

</body>
</html>
